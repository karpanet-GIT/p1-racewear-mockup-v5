<p style="margin: 0; font-size: 20px; color: #C9C9CC; max-width: 560px">Dietro P1 c'è la persona che ha inventato il racewear moderno italiano. E un atelier che non produce in serie: taglia e cuce ogni capo sulle misure e sui colori di chi lo indosserà.</p>

<span style="align-self: flex-start; background: #DBFB00; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; padding: 4px 8px">IL FONDATORE</span>
<h2 id="chi" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 60px; line-height: 0.95; text-transform: uppercase">Enrico Glorioso</h2>
<div style="height: 420px; background: #F7F7F4; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="https://cdn.shopify.com/s/files/1/0795/7010/8699/files/P1Images_0000s_0005_PRO-R_Anthracite.jpg?width=800" alt="Tuta PRO-R antracite" loading="lazy" style="width: 100%; height: 100%; object-fit: contain; padding: 16px; box-sizing: border-box; mix-blend-mode: multiply; display: block"><span style="position: absolute; left: 14px; bottom: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A5B5E">[RITRATTO: Enrico Glorioso]</span><img src="img/enrico_glorioso.jpg" alt="Enrico Glorioso, fondatore di P1 Advanced Racewear" referrerpolicy="no-referrer" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 22px; font-size: 19px; color: #26272A; padding-top: 8px">
<p style="margin: 0">Nel 1977 Enrico Glorioso fonda Sparco e, in oltre trent'anni, la trasforma nella più grande azienda di racewear al mondo, con più di 300.000 tute omologate FIA prodotte.</p>
<p style="margin: 0">Dopo averla ceduta, nel 2010 decide di ricominciare con un progetto più piccolo e più personale: P1 Advanced Racewear. Un marchio dedicato solo all'abbigliamento da gara, nato dal rapporto diretto con i piloti e dalla volontà di capirne davvero le esigenze.</p>
<p style="margin: 0">Oggi P1 è il marchio di Gloria Cars Srl. Il suo staff di produzione porta in atelier decenni di esperienza nel cucito tecnico, e i suoi capi sono distribuiti anche all'estero, come nel Regno Unito con Nicky Grist Motorsports.</p>
<blockquote style="margin: 16px 0 0; padding: 24px 28px; background: #0E0E0E; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 34px; line-height: 1.1">“[CITAZIONE DI ENRICO GLORIOSO]”<span style="display: block; margin-top: 12px; font-family: 'Work Sans', sans-serif; font-style: normal; font-weight: 500; font-size: 15px; color: #DBFB00">— Enrico Glorioso, fondatore</span></blockquote>
</div>
</section>
