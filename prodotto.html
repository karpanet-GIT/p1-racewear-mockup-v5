<p style="margin: 0">La PRO-R è la tuta premium di P1 per GT, rally e turismo, adatta a tutte le discipline. È omologata secondo lo standard FIA 8856-2018, il più recente e il più severo per l'abbigliamento dei piloti nelle gare FIA.</p>
<p style="margin: 0">Nonostante i requisiti di sicurezza più alti, è il 45% più traspirante della tuta PRO della precedente omologazione: un vantaggio decisivo quando si corre al caldo. Il sistema R-FLEXI, migliorato ancora, accompagna i movimenti del corpo; le spalline sono state riprogettate per essere più robuste e più comode.</p>
<p style="margin: 0">È disponibile in tre abbinamenti di serie oppure su misura, in 25 colori, con il tuo nome e i loghi dei tuoi sponsor.</p>
